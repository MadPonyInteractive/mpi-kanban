name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the plugin before release
        run: python scripts/validate_plugin.py

      - name: Check the plugin version matches the tag
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "plugin.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          python scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md
          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.notes_path }}
          draft: false
          prerelease: false
