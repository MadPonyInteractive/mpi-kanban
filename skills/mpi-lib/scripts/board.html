<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mpi-Kanban</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --card: #fff; --line: #d8dbe0;
  --text: #1c1f23; --muted: #6b7280; --accent: #4aa3ff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181d; --panel: #1d2026; --card: #22262d; --line: #33383f;
          --text: #e6e8ea; --muted: #939aa4; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45
       system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
         background: var(--panel); border-bottom: 1px solid var(--line);
         position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
#where { color: var(--muted); font-size: 11.5px; max-width: 34ch; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
nav { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
nav:empty { display: none; }
#stamp { margin-left: auto; }
nav button { font: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer;
             border: 1px solid var(--line); background: transparent; color: var(--muted); }
nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
nav button.bad { border-style: dashed; }
#stamp { color: var(--muted); font-size: 12px; }
#stamp.stale { color: #ff8c42; }
main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px;
       align-items: start; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px; }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--muted); margin: 2px 4px 10px; }
section h2 span { float: right; }
article { background: color-mix(in srgb, var(--hue, transparent) 16%, var(--card));
          border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
          margin-bottom: 8px; cursor: pointer; }
article:hover { border-color: var(--accent); }
article.on { outline: 2px solid var(--accent); }
article b { font-weight: 600; display: block; }
.meta { display: flex; gap: 8px; align-items: center; margin-top: 6px;
        color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--muted)); }
.warn { color: #ff8c42; }
.empty { color: var(--muted); padding: 6px 4px; font-style: italic; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); z-index: 3;
        background: var(--panel); border-left: 1px solid var(--line); overflow: auto;
        padding: 16px 20px; box-shadow: -8px 0 24px #0003; }
aside[hidden] { display: none; }
aside h3 { margin: 0 8px 6px 0; font-size: 16px; }
aside p { white-space: pre-wrap; }
aside ul { list-style: none; padding: 0; }
aside li { padding: 2px 0; }
aside li.done { color: var(--muted); text-decoration: line-through; }
.links { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.links button, .close { font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer;
                        border: 1px solid var(--line); background: var(--card); color: var(--text); }
.links button.on { border-color: var(--accent); color: var(--accent); }
.close { float: right; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 12px; overflow: auto; white-space: pre-wrap; font-size: 12.5px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="who">Mpi-Kanban</h1>
  <code id="where"></code>
  <nav id="tabs"></nav>
  <span id="stamp"></span>
</header>
<main id="board"></main>
<aside id="detail" hidden></aside>
<script>
const HUES = {
  "idea": null, "planned": "#4aa3ff", "research": "#00c2d1",
  "needs-decision": "#ff5fa8", "blocked": "#ff8c42", "deferred": "#5a7fa0",
  "in-progress": "#b072ff", "validating": "#ffd21f",
  "complete": "#2fd96b", "rejected": "#8b95a5",
};
const INVALID = "#ff4f64";

let repo = new URLSearchParams(location.search).get("repo") || "";
let seenTabs = "", seenBoard = "", picked = null, openLink = null, board = null;

const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const hue = m => (m in HUES ? HUES[m] : INVALID);

async function get(path) {
  const response = await fetch(path, { cache: "no-store" });
  return { ok: response.ok, text: await response.text() };
}

async function load() {
  let tabList, current;
  try {
    tabList = await get("/api/boards");
    current = await get("/api/board" + (repo ? "?repo=" + encodeURIComponent(repo) : ""));
  } catch (err) {
    stamp.textContent = "server not responding";
    stamp.className = "stale";
    return;
  }
  if (tabList.text !== seenTabs) { seenTabs = tabList.text; drawTabs(JSON.parse(tabList.text).boards); }
  if (current.text !== seenBoard) {
    seenBoard = current.text;
    board = JSON.parse(current.text);
    if (!repo && board.repo) { repo = board.repo; pinUrl(); drawTabs(JSON.parse(seenTabs).boards); }
    // Which board is this? The window title carries it too -- three browser tabs
    // all reading "Mpi-Kanban" is the same problem one address was meant to fix.
    document.title = board.repo + " board";
    who.textContent = board.repo;
    // The branch the agent writing these cards is standing in. The board itself
    // is per working tree, not per branch, so this explains a checkout - it does
    // not filter anything.
    where.textContent = board.root + (board.branch ? "  @" + board.branch : "");
    where.title = where.textContent;
    drawBoard();
    drawDetail();
  }
  stamp.textContent = new Date().toLocaleTimeString();
  stamp.className = "";
}

function pinUrl() {
  history.replaceState(null, "", "?repo=" + encodeURIComponent(repo));
}

function drawTabs(boards) {
  tabs.textContent = "";
  if (boards.length < 2) return;  // the heading already names the only board
  for (const entry of boards) {
    const button = el("button", (entry.name === repo ? "on " : "") + (entry.ok ? "" : "bad"));
    button.textContent = entry.name;
    button.title = entry.root + (entry.branch ? "  @" + entry.branch : "")
      + (entry.ok ? "" : " - " + entry.error);
    button.onclick = () => {
      repo = entry.name; picked = null; openLink = null; seenBoard = "";
      // Redraw here too: the poll only calls drawTabs when the REGISTRY changes,
      // so without this the `on` highlight stays on whichever tab was current
      // when the page loaded and every click looks like it did nothing.
      pinUrl(); drawTabs(boards); load();
    };
    tabs.append(button);
  }
}

function drawBoard() {
  boardEl.textContent = "";
  if (!board.ok) {
    const note = el("p", "empty");
    note.textContent = board.error;
    boardEl.append(note);
    return;
  }
  for (const column of board.columns) {
    const section = el("section");
    const heading = el("h2");
    heading.textContent = column.title;
    const count = el("span");
    count.textContent = column.tasks.length || "";
    heading.append(count);
    section.append(heading);
    if (!column.tasks.length) {
      const note = el("p", "empty");
      note.textContent = "empty";
      section.append(note);
    }
    for (const task of column.tasks) section.append(card(task));
    boardEl.append(section);
  }
}

function card(task) {
  const node = el("article", picked === task.id ? "on" : "");
  const tint = hue(task.maturity);
  if (tint) node.style.setProperty("--hue", tint);
  const title = el("b");
  title.textContent = task.title || task.id;
  node.append(title);

  const meta = el("div", "meta");
  const id = el("span");
  id.textContent = task.id;
  meta.append(id);
  if (task.maturity) {
    const chip = el("span", "chip");
    chip.append(el("i"), document.createTextNode(task.maturity));
    meta.append(chip);
  }
  const ticked = task.checklist.filter(item => item.completed).length;
  if (task.checklist.length) {
    const progress = el("span");
    progress.textContent = ticked + "/" + task.checklist.length;
    meta.append(progress);
  }
  if (task.attention && task.attention.state === "required") {
    const flag = el("span", "warn");
    flag.textContent = "needs attention";
    meta.append(flag);
  }
  if (task.error) {
    const broken = el("span", "warn");
    broken.textContent = task.error;
    meta.append(broken);
  }
  node.append(meta);
  node.onclick = () => { picked = task.id; openLink = null; drawBoard(); drawDetail(); };
  return node;
}

function findPicked() {
  if (!board || !board.ok || !picked) return null;
  for (const column of board.columns) {
    for (const task of column.tasks) if (task.id === picked) return task;
  }
  return null;
}

function drawDetail() {
  const task = findPicked();
  detail.textContent = "";
  detail.hidden = !task;
  if (!task) return;

  const close = el("button", "close");
  close.textContent = "close";
  close.onclick = () => { picked = null; drawBoard(); drawDetail(); };
  const heading = el("h3");
  heading.textContent = task.id + "  " + (task.title || "");
  detail.append(close, heading);

  const meta = el("div", "meta");
  const tint = hue(task.maturity);
  if (tint) meta.style.setProperty("--hue", tint);
  if (task.maturity) {
    const chip = el("span", "chip");
    chip.append(el("i"), document.createTextNode(task.maturity));
    meta.append(chip);
  }
  const when = el("span");
  when.textContent = "updated " + (task.updated_at || "?");
  meta.append(when);
  detail.append(meta);

  if (task.attention && task.attention.state === "required") {
    const flag = el("p", "warn");
    flag.textContent = "Needs attention: " + (task.attention.reason || "");
    detail.append(flag);
  }
  if (task.description) {
    const body = el("p");
    body.textContent = task.description;
    detail.append(body);
  }
  if (task.checklist.length) {
    const list = el("ul");
    for (const item of task.checklist) {
      const row = el("li", item.completed ? "done" : "");
      row.textContent = (item.completed ? "[x] " : "[ ] ") + item.text;
      list.append(row);
    }
    detail.append(list);
  }

  const links = el("div", "links");
  for (const [key, value] of Object.entries(task.links || {})) {
    if (typeof value !== "string" || value.endsWith("/")) continue;  // folders have nothing to show
    const button = el("button", openLink === key ? "on" : "");
    button.textContent = key;
    button.onclick = () => { openLink = openLink === key ? null : key; drawDetail(); };
    links.append(button);
  }
  if (links.children.length) detail.append(links);

  if (openLink) {
    const view = el("pre");
    view.textContent = "loading " + openLink + "...";
    detail.append(view);
    get("/api/task/" + encodeURIComponent(repo) + "/" + encodeURIComponent(task.id) +
        "/" + encodeURIComponent(openLink))
      .then(result => { view.textContent = result.text; })
      .catch(err => { view.textContent = String(err); });
  }
}

const who = document.getElementById("who");
const where = document.getElementById("where");
const tabs = document.getElementById("tabs");
const stamp = document.getElementById("stamp");
const boardEl = document.getElementById("board");
const detail = document.getElementById("detail");
load();
setInterval(load, 2000);
</script>
</body>
</html>
